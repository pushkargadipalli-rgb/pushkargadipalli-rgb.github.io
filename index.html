  <style>
    :root {
      --bg-main: linear-gradient(180deg, #0f172a, #020617);
      --card-bg: #020617;
      --border: #1e293b;
      --text-main: #e5e7eb;
      --text-muted: #cbd5f5;
      --accent: #38bdf8;
      --btn: #2563eb;
      --btn-hover: #1d4ed8;
    }

    body.light {
      --bg-main: #f4f6f8;
      --card-bg: #ffffff;
      --border: #e5e7eb;
      --text-main: #111827;
      --text-muted: #4b5563;
      --accent: #2563eb;
      --btn: #2563eb;
      --btn-hover: #1d4ed8;
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      line-height: 1.6;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 60px 20px;
    }

    /* HERO */
    .hero {
      text-align: center;
      margin-bottom: 70px;
    }

    .hero h1 {
      font-size: 40px;
      margin-bottom: 6px;
    }

    .hero p {
      margin: 6px 0;
      color: var(--text-muted);
    }

    .hero a {
      color: var(--accent);
      text-decoration: none;
      margin: 0 10px;
      font-weight: 500;
    }

    .resume-btn {
      display: inline-block;
      margin-top: 18px;
      padding: 12px 28px;
      background: var(--btn);
      color: white;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 500;
      transition: background 0.25s ease, transform 0.25s ease;
    }

    .resume-btn:hover {
      background: var(--btn-hover);
      transform: translateY(-2px);
    }

    .toggle {
      margin-top: 20px;
      cursor: pointer;
      font-size: 14px;
      color: var(--accent);
    }

    /* CARD */
    .card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 32px;
      margin-bottom: 40px;
      border: 1px solid var(--border);
      box-shadow: 0 15px 30px rgba(0,0,0,0.5);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 25px 45px rgba(0,0,0,0.6);
    }

    .card h2 {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 24px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 10px;
    }

    /* PROJECTS */
    .project-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }

    .project-card {
      background: var(--card-bg);
      padding: 22px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .project-card h3 {
      margin-top: 0;
    }

    .project-card p {
      color: var(--text-muted);
      font-size: 14px;
    }

    .project-links a {
      display: inline-block;
      margin-right: 12px;
      margin-top: 8px;
      color: var(--accent);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }

    ul {
      padding-left: 20px;
    }

    li {
      margin-bottom: 8px;
    }

    /* CONTACT */
    .contact a {
      display: inline-block;
      margin-right: 15px;
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    footer {
      text-align: center;
      margin-top: 70px;
      font-size: 14px;
      color: var(--text-muted);
    }
  </style>
</head>
